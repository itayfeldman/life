version: 1
formatters:
  simple:
    format: '%(asctime)s %(levelname)-8s %(name)-12s %(message)s'
handlers:
  console:
    class: logging.StreamHandler
    formatter: simple
    level: INFO
    stream: ext://sys.stdout
  file:
    class: logging.FileHandler
    formatter: simple
    filename: logs/development.log
    level: DEBUG
root:
  level: INFO
  handlers: [console, file]