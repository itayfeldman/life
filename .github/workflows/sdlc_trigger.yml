name: SDLC TODO → Experiment Architect

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"

jobs:
  experiment-architect:
    name: Scan TODOs and Generate Experiment Briefs
    runs-on: ubuntu-latest

    permissions:
      contents: write   # Needed to commit generated briefs back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # Need HEAD and HEAD~1 for git diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run TODO scanner and Experiment Architect
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python sdlc_trigger/run.py \
            --mode git \
            --repo . \
            --output-dir experiment_briefs

      - name: Check for generated briefs
        id: check_briefs
        run: |
          if [ -d "experiment_briefs" ] && [ "$(ls -A experiment_briefs 2>/dev/null)" ]; then
            echo "has_briefs=true" >> $GITHUB_OUTPUT
          else
            echo "has_briefs=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit experiment briefs back to repository
        if: steps.check_briefs.outputs.has_briefs == 'true'
        run: |
          git config user.name  "experiment-architect[bot]"
          git config user.email "experiment-architect[bot]@users.noreply.github.com"
          git add experiment_briefs/
          git diff --staged --quiet || git commit -m "chore(sdlc): generate experiment briefs from #TODO annotations [skip ci]"
          git push
